<!DOCTYPE html>
<html>
<head>
{{#data.articleById.item}}
  <title>{{title}}</title>
  <meta property="og:title" content="{{title}}">
  <meta name="template" content="article">
  <meta name="publication-date" content="{{pubdate}}">
{{/data.articleById.item}}
</head>
<body>
  <header></header>
  <main>
{{#data.articleById.item}}
    <div>
      <div class="article-header">
        <div>
          <div><p><a href="/news">News</a></p></div>
        </div>
        <div>
          <div>
            <h1>{{title}}</h1>
            {{{subTitle.html}}}
          </div>
        </div>
        <div>
          <div><p>{{pubdate}}</p></div>
        </div>
      </div>
    </div>
    <div>
      <div class="article-body">
        <div>
          <div>
            {{{body.html}}}
          </div>
        </div>
      </div>
    </div>
{{/data.articleById.item}}
  </main>
  <footer></footer>
</body>
</html>
